# PAR-0003 (iOS app shell T0-pre): XcodeGen input. `xcodegen generate` writes ZChat.xcodeproj (git-ignored, never
# hand-edited). Installed from the owner's Mac with his personal team (WI-13): pick the team in Xcode, Signing.
name: ZChat
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  ZChatCore:
    path: Packages/ZChatCore
targets:
  ZChat:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
    dependencies:
      - package: ZChatCore
        product: ZChatCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.decentrathai.zchat.t0pre
        PRODUCT_NAME: ZChat
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: ZChat
        MARKETING_VERSION: "0.0.1"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: "YES"
