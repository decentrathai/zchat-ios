# Plan F.1 core-linux on GitHub Free Linux minutes only (owner 23 Nov 2026: no GitHub charge; IOSP-16).
# One job per push (GitHub bills each job rounded up to a minute), no pull_request trigger (a PR from dev would run
# the same commit twice). The guard refuses a push while any workflow here leaves the free-tier rule (test_ci_cost).
# ZChatCore build + tests join when Packages/ZChatCore/Package.swift exists (Swift ships on the ubuntu-24.04 image).
name: core-linux
on:
  push:
    branches: [dev, "lane/**"]
permissions:
  contents: read
concurrency:
  group: core-linux-${{ github.ref }}
  cancel-in-progress: true
jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Harness tests
        run: python3 -m unittest discover -s tools/qa/tests -v 2>&1 | tail -40
        shell: bash -o pipefail {0}
      - name: Secret scan of this push
        run: python3 -I tools/qa/vendor/secret_scan.py --hard-only --summary --allow tools/qa/vendor/secret_scan.allow.txt files .
      - name: ZChatCore build and tests
        if: hashFiles('Packages/ZChatCore/Package.swift') != ''
        working-directory: Packages/ZChatCore
        run: swift --version && swift test
